[platformio]
# Project root — the whole directory. What is actually built is selected
# per env via build_src_filter.
src_dir = .

# Common settings for all environments.
[common]
platform = espressif32
board = m5stack-cores3
framework = arduino

upload_port = /dev/ttyACM0
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

lib_deps =
    links2004/WebSockets@^2.4.1
    m5stack/M5Unified@^0.2.9
    https://github.com/m5stack/StackChan-BSP.git
    https://github.com/stack-chan/m5stack-avatar.git

build_flags =
    -std=gnu++17
    -Iconfig
    -Isrc
    -DUART_SCLK_DEFAULT=UART_SCLK_XTAL
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MSC_ON_BOOT=0
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=32768

build_unflags =
    -std=gnu++11

# ---------------------------------------------------------------------------
# Robot firmware: entry point in src/aibot/main.cpp + all modules.
# ---------------------------------------------------------------------------
[env:m5stack-cores3]
extends = common
build_src_filter = +<src/aibot/*> +<src/wifi/wifi.cpp> +<src/websocket/websocket.cpp> +<src/move/move.cpp> +<src/screen/screen.cpp> +<src/sound/sound.cpp>